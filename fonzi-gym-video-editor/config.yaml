# fonzi-gym-video-editor settings. No secrets in this file: API keys live in .env only.

generator:
  provider: seedance-2.5        # default generator for multicam angles and B-roll
  fallback: kling-multicam      # second choice, used only when you ask for it (--provider kling-multicam)
  # Never used, whatever anyone asks: Google Omni, and OpenAI Sora (shut down).
  blocked: [google-omni, omni, sora, openai-sora]
  # Money guard: the generator stops and asks if one job would send more than this many seconds.
  max_generated_seconds: 24

providers:
  seedance-2.5:
    api: fal                                   # fal.ai queue API, key in .env as FAL_KEY
    model: bytedance/seedance-2.5/reference-to-video
    key_env: FAL_KEY
    task: editing                              # edit the reference clip, keep its timing
    resolution: 720p                           # 480p | 720p | 1080p (1080p costs about 2.5x)
    aspect_ratio: "9:16"
    min_clip_seconds: 4                        # model limits: 4-30s output, 1.8-30.2s reference
    max_clip_seconds: 30
  kling-multicam:
    api: fal
    # Kling has no public endpoint called "Multi-Cam" that could be confirmed. Put the model id of
    # the Kling video-reference endpoint your account has here before using it.
    model: ""
    key_env: FAL_KEY
    aspect_ratio: "9:16"
    min_clip_seconds: 5                        # 3-10s reference clip in, 5-10s out
    max_clip_seconds: 10
    reference_min_seconds: 3
    reference_max_seconds: 10
  local-reframe:
    api: local   # NOT AI. A stand-in for tests: re-frames your own pixels so the pipeline can run without a key.

multicam:
  cuts: 4                       # 4 hard cuts = 2 angle changes away from the original camera and back
  min_shot_seconds: 4.0
  max_shot_seconds: 6.0
  angles: [three-quarter, low]  # choose from: profile, three-quarter, low, high
  broll_seconds: 5.0            # default length of a requested B-roll shot

audio:
  # Only audio you uploaded: the video's own sound plus mp3s in songs/. No stock music, no AI music.
  songs_dir: songs
  allow_generated_music: false
  original_audio_is_truth: true # generated clips never replace or shift the audio
