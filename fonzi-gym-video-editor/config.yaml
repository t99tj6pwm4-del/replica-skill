# fonzi-gym-video-editor settings. No secrets in this file: API keys live in .env only.

generator:
  # Multicam generator order. FULLY AUTOMATIC: Alfonso uploads one video and nothing else.
  #   1. free-local      DEFAULT. $0, instant, automatic: ffmpeg crops / punch-ins / reframes of his real
  #                      footage, so face, room, clothes and light match by construction
  #   2. seedance-2.5    real AI angles via the fal.ai API, ONLY after Alfonso says yes AND fal.ai credit is confirmed
  #   3. google-flow     MANUAL web UI: optional later upgrade only, never required, never waited for
  #   4. kling-multicam  model id blank until confirmed
  #   5. ltx-2.5         API only, model id blank until confirmed
  #   6. minimax-h3      audio off, model id blank until confirmed
  order: [free-local, seedance-2.5, google-flow, kling-multicam, ltx-2.5, minimax-h3]
  provider: free-local           # multicam default: automatic, no manual step
  extend_provider: free-local    # footage extension default ($0)
  blocked: [sora, openai-sora]   # Sora is shut down: never, anywhere
  # Money guard for the paid APIs: stop and ask if one job would generate more than this many seconds.
  max_generated_seconds: 24
  paid_needs_yes_spend: true     # a paid API never runs without --yes-spend (Alfonso's go-ahead)

providers:
  google-flow:
    api: manual-web              # MANUAL, optional upgrade only: flow.google.com with Alfonso's account, no API.
    optional_upgrade_only: true  # never a requirement; if he later sends Flow clips: multicam_generate.py --use-clips DIR
    site: https://flow.google.com
    plan: free                   # 50 credits a day, no subscription, credits do not roll over
    daily_credits: 50
    # OMNI EXCEPTION: Omni Flash 1.2 is allowed ONLY here, ONLY for multicam reframes of existing
    # footage. Omni is not used anywhere else in this project (not for B-roll, captions or posting).
    reframe_model: Omni Flash 1.2       # video-to-video reframe of the real clip, ~16s of 720p a day
    broll_model: Veo 3.1 Lite           # new angle / B-roll from a still frame, 10 credits per clip
    never_on_free_tier: [Veo 3.1 Quality]   # 100 credits a clip: impossible on 50 a day
    clip_seconds: [4, 6, 8]
    max_clip_seconds: 8
    min_clip_seconds: 3
    resolution: 720p
    aspect_ratio: "9:16"
    if_blocked_at_peak: wait and retry; never switch to a paid plan without asking Alfonso
  seedance-2.5:
    api: fal
    needs: Alfonso's explicit yes + confirmed fal.ai credit (then --provider seedance-2.5 --yes-spend)
    model: bytedance/seedance-2.5/reference-to-video
    key_env: FAL_KEY
    task: editing
    resolution: 720p
    aspect_ratio: "9:16"
    min_clip_seconds: 4
    max_clip_seconds: 30
    cost_per_second_usd: 0.473
  kling-multicam:
    api: fal
    # 3-10s reference clip in; profile / three-quarter / low / high; 5-10s out; 9:16. Fill in the Kling
    # video-reference model id your account has before using it.
    model: ""
    key_env: FAL_KEY
    aspect_ratio: "9:16"
    min_clip_seconds: 5
    max_clip_seconds: 10
  ltx-2.5:
    api: fal
    # B-roll only, API only. LTX-2.5 is not listed on fal.ai yet; put its model id here when it is.
    model: ""
    key_env: FAL_KEY
    broll_only: true
  minimax-h3:
    api: fal
    # Backup only. Generated audio FULLY OFF, 4-15s short B-roll inserts only. Model id once listed.
    model: ""
    key_env: FAL_KEY
    generate_audio: false
    min_clip_seconds: 4
    max_clip_seconds: 15
  ltx-cheap:
    api: fal
    model: fal-ai/ltxv-13b-098-distilled/extend
    key_env: FAL_KEY
    resolution: 720p
    aspect_ratio: "9:16"
    cost_per_second_usd: 0.02    # footage extension only
  free-local:
    api: local                   # $0, NOT AI: re-framed crops / replays of the real footage
    cost_per_second_usd: 0
  local-reframe:
    api: local                   # old name of free-local
    cost_per_second_usd: 0

multicam:
  shots: 4                       # 4 FRESH shots per video from the 100-shot library (docs/multicam_shot_library.md),
                                 # 4 different categories, fitted to the moment, no repeats from the last video
                                 # (output/multicam_shots_log.md), shot 100 closing only. NO default angles.
  local_shot_seconds: [3.0, 8.0] # free-local angle shot length
  skip_shots: [42, 74]           # cannot be done safely / cleanly in Flow: fisheye, camera mounted on the bar
  flow_prompt: >-
    Hard cut to [SHOT]. Preserve identity and room exactly: same person, same face, same clothes, same gym,
    same lighting. Keep the original voice, speech and lip-sync exactly — do not rewrite, drop or add words.
    No music, no subtitles, no text on screen. Vertical 9:16, 8 seconds.
  min_shot_seconds: 4.0
  max_shot_seconds: 6.0
  broll_seconds: 6.0             # Veo 3.1 Lite clips are 4 / 6 / 8 s

audio:
  songs_dir: songs               # only Alfonso's own mp3s; no stock or AI music
  allow_generated_music: false
  original_audio_is_truth: true  # generated clips never replace or shift the audio
