# fonzi-gym-video-editor settings. No secrets in this file: API keys live in .env only.

generator:
  # Multicam generator order. FULLY AUTOMATIC: Alfonso uploads one video and nothing else.
  #   1. free-local      DEFAULT. $0, instant, automatic: ffmpeg crops / punch-ins / reframes of his real
  #                      footage, so face, room, clothes and light match by construction
  #   2. seedance-2.5    real AI angles via the fal.ai API, ONLY after Alfonso says yes AND fal.ai credit is confirmed
  #   3. google-flow     MANUAL web UI: optional later upgrade only, never required, never waited for
  #   4. kling-multicam  model id blank until confirmed
  #   5. ltx-2.5         API only, model id blank until confirmed
  #   6. minimax-h3      audio off, model id blank until confirmed
  #   0. wan-free        FREE real AI angles: Wan 2.2 image-to-video on a Hugging Face ZeroGPU Space, from the
  #                      real frame at each timestamp (free token HF_TOKEN). Any shot that fails falls back to free-local.
  order: [wan-free, free-local, seedance-2.5, google-flow, kling-multicam, ltx-2.5, minimax-h3]
  provider: wan-free             # multicam default: free AI, automatic, crop fallback per shot
  extend_provider: free-local    # footage extension default ($0)
  blocked: [sora, openai-sora]   # Sora is shut down: never, anywhere
  # Money guard for the paid APIs: stop and ask if one job would generate more than this many seconds.
  max_generated_seconds: 24
  paid_needs_yes_spend: true     # a paid API never runs without --yes-spend (Alfonso's go-ahead)

providers:
  google-flow:
    api: manual-web              # MANUAL, optional upgrade only: flow.google.com with Alfonso's account, no API.
    optional_upgrade_only: true  # never a requirement; if he later sends Flow clips: multicam_generate.py --use-clips DIR
    site: https://flow.google.com
    plan: free                   # 50 credits a day, no subscription, credits do not roll over
    daily_credits: 50
    # OMNI EXCEPTION: Omni Flash 1.2 is allowed ONLY here, ONLY for multicam reframes of existing
    # footage. Omni is not used anywhere else in this project (not for B-roll, captions or posting).
    reframe_model: Omni Flash 1.2       # video-to-video reframe of the real clip, ~16s of 720p a day
    broll_model: Veo 3.1 Lite           # new angle / B-roll from a still frame, 10 credits per clip
    never_on_free_tier: [Veo 3.1 Quality]   # 100 credits a clip: impossible on 50 a day
    clip_seconds: [4, 6, 8]
    max_clip_seconds: 8
    min_clip_seconds: 3
    resolution: 720p
    aspect_ratio: "9:16"
    if_blocked_at_peak: wait and retry; never switch to a paid plan without asking Alfonso
  seedance-2.5:
    api: fal
    needs: Alfonso's explicit yes + confirmed fal.ai credit (then --provider seedance-2.5 --yes-spend)
    model: bytedance/seedance-2.5/reference-to-video
    key_env: FAL_KEY
    task: editing
    resolution: 720p
    aspect_ratio: "9:16"
    min_clip_seconds: 4
    max_clip_seconds: 30
    cost_per_second_usd: 0.473
  kling-multicam:
    api: fal
    # 3-10s reference clip in; profile / three-quarter / low / high; 5-10s out; 9:16. Fill in the Kling
    # video-reference model id your account has before using it.
    model: ""
    key_env: FAL_KEY
    aspect_ratio: "9:16"
    min_clip_seconds: 5
    max_clip_seconds: 10
  ltx-2.5:
    api: fal
    # B-roll only, API only. LTX-2.5 is not listed on fal.ai yet; put its model id here when it is.
    model: ""
    key_env: FAL_KEY
    broll_only: true
  minimax-h3:
    api: fal
    # Backup only. Generated audio FULLY OFF, 4-15s short B-roll inserts only. Model id once listed.
    model: ""
    key_env: FAL_KEY
    generate_audio: false
    min_clip_seconds: 4
    max_clip_seconds: 15
  ltx-cheap:
    api: fal
    model: fal-ai/ltxv-13b-098-distilled/extend
    key_env: FAL_KEY
    resolution: 720p
    aspect_ratio: "9:16"
    cost_per_second_usd: 0.02    # footage extension only
  wan-free:
    api: hf-space                # free, automatic: gradio_client call, no manual step
    space: zerogpu-aoti/wan2-2-fp8da-aoti-faster
    model: Wan 2.2 image-to-video (fp8, ZeroGPU)
    key_env: HF_TOKEN            # free Hugging Face token, daily ZeroGPU quota
    min_clip_seconds: 2.5
    max_clip_seconds: 4.5        # short clips (480x832, 16fps), upscaled to 1080x1920 30fps
    steps: 6
    seed: 42
  free-local:
    api: local                   # $0, NOT AI: re-framed crops / replays of the real footage
    cost_per_second_usd: 0
  local-reframe:
    api: local                   # old name of free-local
    cost_per_second_usd: 0

multicam:
  shots: 4                       # 4 FRESH shots per video from the 100-shot library (docs/multicam_shot_library.md),
                                 # 4 different categories, fitted to the moment, no repeats from the last video
                                 # (output/multicam_shots_log.md), shot 100 closing only. NO default angles.
  local_shot_seconds: [3.0, 8.0] # free-local angle shot length
  skip_shots: [42, 74]           # cannot be done safely / cleanly in Flow: fisheye, camera mounted on the bar
  require_top_down: true         # Alfonso (2026-11-15): at least ONE top-down shot in every video
  top_down_shots: [13, 14, 24]   # bird's eye, extreme high angle, high ceiling corner (13 preferred); exempt
                                 # from the no-repeat rule so every video can have one
  flow_prompt: >-
    Hard cut to [SHOT]. Preserve identity and room exactly: same person, same face, same clothes, same gym,
    same lighting. Keep the original voice, speech and lip-sync exactly — do not rewrite, drop or add words.
    No music, no subtitles, no text on screen. Vertical 9:16, 8 seconds.
  min_shot_seconds: 4.0
  max_shot_seconds: 6.0
  broll_seconds: 6.0             # Veo 3.1 Lite clips are 4 / 6 / 8 s

audio:
  songs_dir: songs               # only Alfonso's own mp3s; no stock or AI music
  allow_generated_music: false
  original_audio_is_truth: true  # generated clips never replace or shift the audio
  mute_baked_music: true         # Alfonso (2026-11-15): "always mute" music baked into his uploads. With no
                                 # speech in the cut the final video's sound is muted (he adds a sound in the app,
                                 # or we mix one of his own mp3s from songs/). His own voice is never muted.

titles:
  # normal       = the usual animated title card, captions, lower-thirds, end card
  # layered-gold = Layered Title (Documentary Gold): ONE giant gold two-line title, "FONZI" BEHIND the
  #                person, "STAYS FIT" + intro line IN FRONT, ~3.5s after the cold open; NO subtitles,
  #                captions, lower-thirds or end card anywhere. Only when it seems right (story / intro /
  #                documentary, a clean standing shot); never on fast gym reels, song videos or quick cuts.
  #                Turn on per video: render_final.py --title-style layered-gold (or storyboard "title_style").
  title_style: normal
  # Alfonso 2026-11-18: exercise-title back words go BEHIND him even if mostly hidden (not readable is fine).
  # QA accepts 2%..max_back_cover of the back word covered by his body. front_only only when he is not in shot.
  max_back_cover: 0.95
  # Alfonso 2026-11-19 (from the captions-reel write-up): cleaner cut-out + a virtual camera through the layers
  cut_model: birefnet-general-lite # rembg cut-out model: much cleaner edges than u2net_human_seg; ~9 s a frame on CPU
                                   # (birefnet-portrait is best but ~15 s and ~9 GB RAM a frame: too heavy here)
  cut_every: 2                     # run the cut-out on every 2nd frame; in-between frames use their neighbours
  parallax:
    enabled: true
    back_push: 0.03                # back word grows 3% over the title window
    front_push: 0.05               # front words grow 5%: they feel closer to the camera (more clips the frame edge)
    drift_px: 12                   # back word drifts up, front words drift down

# Alfonso's HARD RULE (2026-11-17): every video is 90 seconds long (end card included). QA fails anything
# outside target +/- tolerance. The storyboard plans 90s, the song section must cover 90s.
video_length:
  target_seconds: 90
  tolerance_seconds: 1.0

# Alfonso 2026-11-19: a quiet sound on every text move. The sounds are made by scripts/make_sfx.py from plain
# synthesis (no stock, no AI). Mixed UNDER the voice / his song, never replacing it. Swap in his own files any time.
sfx:
  enabled: true
  volume_db: -16                   # relative to full scale; keep it under the voice and the song
  title: sfx/whoosh.wav            # each gold layered exercise title
  popup: sfx/pop.wav               # each exercise bar / checklist / form tip card
  hook: sfx/whoosh.wav             # the hook title card

# Alfonso 2026-11-21 (STYLE.md rule 0): the Fonzi intro card, baked in by scripts/finish_fx.py after the render
# (style_fx.py intro). Style strobe / pulse alternates per video (posted/style_rotation.json).
intro:
  max_dur: 3.0                     # seconds from 0; also stops at the hook end and the first gold exercise title
  min_dur: 1.2                     # less room than this before the first title: finish_fx.py stops and says so
  logo_sfx_db: -6                  # the logo end card's clicks / crackle under the song

# Alfonso 2026-11-19: AI camera angles from Higgsfield (his credits, his yes). Run by the Director via MCP tools.
higgsfield:
  enabled: true
  model: kling_o3_image_reference   # "Kling 3.0 Omni" image-reference, std = 720p
  mode: std
  aspect_ratio: "9:16"
  sound: "off"
  clip_seconds: 3                   # ~3 credits each (5 s ~6.25); slots are 2.5-3.5 s
  max_reference_images: 7


# Alfonso 2026-11-21: OpenFilm installed for its free media library ONLY (scripts/openfilm_library.sh).
# Sound effects + stickers allowed. Library music stays off until he says yes (his songs only).
openfilm:
  library_only: true
  allow_music: false
